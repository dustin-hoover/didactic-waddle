<title>DockOS Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#EDF2F1; --surface:#FFFFFF; --sunk:#F5F8F7; --ink:#0C1A1F; --muted:#51656B; --line:#CCD9D8;
  --water:#CFE3EA; --shore:#7FA3AE; --boat:#1C5E88; --truck:#A55E0E; --go:#1E7A4B; --stop:#C2332B;
  --warn:#B7791F; --focus:#1C5E88; --chip:#E3ECEB; --onaccent:#FFFFFF;
  --f-display:"Barlow Condensed","Arial Narrow",Roboto Condensed,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#0B1519; --surface:#121F24; --sunk:#0F1B20; --ink:#E4EEED; --muted:#8FA6AB; --line:#24363C;
  --water:#123642; --shore:#3E6A77; --boat:#5AA6D6; --truck:#E0A04A; --go:#45B37B; --stop:#EF6A60;
  --warn:#E5B454; --focus:#5AA6D6; --chip:#1A2A30; --onaccent:#06131A;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0B1519; --surface:#121F24; --sunk:#0F1B20; --ink:#E4EEED; --muted:#8FA6AB; --line:#24363C;
  --water:#123642; --shore:#3E6A77; --boat:#5AA6D6; --truck:#E0A04A; --go:#45B37B; --stop:#EF6A60;
  --warn:#E5B454; --focus:#5AA6D6; --chip:#1A2A30; --onaccent:#06131A;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* status bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:10px 8px;border-bottom:1px solid var(--line)}
.bar-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.mark{font:700 13px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.crew{font:700 26px/1.05 var(--f-display);letter-spacing:.01em;margin:4px 0 0;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--chip);font:600 13px/1.2 var(--f-body);color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.chip.go{color:var(--go)} .chip.nogo{color:var(--stop)} .chip.warn{color:var(--warn)}
.chip.go span,.chip.nogo span,.chip.warn span{color:var(--ink)}

/* chart */
.chart{margin-top:14px;background:var(--water);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
.chart canvas{display:block;width:100%;height:clamp(220px,42vh,360px);touch-action:none}
.legend{position:absolute;left:8px;bottom:8px;display:flex;gap:10px;background:color-mix(in srgb,var(--surface) 88%,transparent);padding:4px 8px;border-radius:6px;font:600 12px/1.2 var(--f-body)}
.legend b{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}

/* tabs */
.tabs{display:flex;gap:4px;margin:16px 0 8px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 8px;font:700 17px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--boat)}

/* run timeline */
.run{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:start;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.stop:hover{background:var(--sunk)}
.buoy{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 20px/1 var(--f-display);border:3px solid var(--boat);color:var(--ink);background:var(--surface)}
.stop[data-status="in_progress"] .buoy{background:var(--warn);border-color:var(--warn);color:var(--onaccent)}
.stop[data-status="closed"] .buoy,.stop[data-status="asbuilt"] .buoy{background:var(--go);border-color:var(--go);color:var(--onaccent)}
.stop[data-p="P1"] .buoy{border-color:var(--stop)}
.eta{font:700 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.what{font:600 16px/1.25 var(--f-body);margin-top:2px}
.where{color:var(--muted);font-size:14px;margin-top:2px}
.leg{font:600 13px/1.2 var(--f-body);white-space:nowrap;text-align:right;color:var(--muted)}
.leg .m{display:block;font:700 18px/1.1 var(--f-display);color:var(--boat)}
.leg.truck .m{color:var(--truck)}
.pill{display:inline-block;font:700 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:4px;background:var(--chip);color:var(--muted);vertical-align:2px;margin-left:6px}
.pill.P1{background:var(--stop);color:var(--onaccent)} .pill.done{background:var(--go);color:var(--onaccent)} .pill.live{background:var(--warn);color:var(--onaccent)}
.home{padding:14px 4px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between}

/* detail */
.back{background:none;border:0;padding:12px 0 4px;font:600 15px/1 var(--f-body);color:var(--boat);cursor:pointer}
.d-head h2{font:700 30px/1.05 var(--f-display);margin:6px 0 4px;text-wrap:balance}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0;font-size:15px}
.facts dt{color:var(--muted)} .facts dd{margin:0}
.mono{font-family:var(--f-mono);font-size:14px;letter-spacing:.02em}
.sel{user-select:all}
h3{font:700 15px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.check{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.check li+li{border-top:1px solid var(--line)}
.check label{display:flex;gap:12px;align-items:center;padding:12px;cursor:pointer;min-height:48px}
.check input{width:22px;height:22px;accent-color:var(--go);flex:none}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.field label{display:block;font:600 13px/1.2 var(--f-body);color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.field .req{color:var(--stop)}
.scan{margin-top:6px;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:600}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.actions .in{max-width:720px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:56px;border-radius:10px;border:0;padding:0 18px;font:700 20px/1 var(--f-display);letter-spacing:.03em;cursor:pointer}
.btn.primary{flex:1 1 170px;background:var(--boat);color:var(--onaccent)}
.btn.primary.complete{background:var(--go)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--chip);color:var(--ink);flex:0 0 auto;padding:0 14px;font-size:18px}
.why{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.why button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 14px;font-weight:600;cursor:pointer}
.why button[aria-pressed="true"]{border-color:var(--stop);color:var(--stop)}
.note{font-size:14px;color:var(--muted)}

/* load list */
.load{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.load label{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;min-height:48px;cursor:pointer}
.load label+label{border-top:1px solid var(--line)}
.load input{width:20px;height:20px;accent-color:var(--go)}
.qty{font:700 18px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:9;max-width:min(560px,calc(100% - 32px));background:var(--ink);color:var(--ground);padding:12px 16px;border-radius:10px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.demo{margin-top:10px;font-size:13px;color:var(--muted);border-left:3px solid var(--warn);padding-left:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.crew{font-size:23px}.eta{font-size:20px}}
</style>

<header class="bar">
  <div class="wrap" style="padding-bottom:0">
    <div class="bar-top"><span class="mark">DockOS Crew</span><span class="mark" id="day"></span></div>
    <h1 class="crew" id="crew">Loading today's run…</h1>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main class="wrap" id="main">
  <p class="demo" id="demo" hidden></p>
  <div class="chart"><canvas id="map" aria-label="Chart of today's route on Beaver Lake" role="img"></canvas>
    <div class="legend"><span><b style="background:var(--boat)"></b>By water</span><span><b style="background:var(--truck)"></b>By road</span></div>
  </div>
  <section id="listView">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabRun" aria-selected="true">Today's run</button>
      <button class="tab" role="tab" id="tabLoad" aria-selected="false">Load list</button>
    </div>
    <div id="runPane"><ol class="run" id="run"></ol><div class="home" id="home"></div></div>
    <div id="loadPane" hidden></div>
  </section>
  <section id="detailView" hidden></section>
</main>
<div class="actions" id="actions" hidden><div class="in" id="actionsIn"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
