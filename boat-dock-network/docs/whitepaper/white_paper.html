<script id="wp-state" type="application/json">{"meta": {"title": "Boat Dock Network", "kicker": "White paper · working draft", "subtitle": "A member-owned, grant-free fiber and wireless network for the whole shoreline of Beaver Lake, Arkansas", "version": 2, "status": "draft", "updated": "2026-09-26T04:30:00+00:00", "preparedFor": "Founders, members, lenders and counsel"}, "sections": [{"id": "summary", "num": "ES", "title": "Executive summary", "html": "\u003cp>\u003cstrong>Boat Dock Network (BDN)\u003c/strong> is a planned member-owned cooperative internet provider for the whole shoreline of Beaver Lake in Northwest Arkansas. It combines fiber where homes are close together with fixed wireless where trees and terrain make fiber uneconomic, and it uses the lake itself as its right-of-way and, where it's faster, its road. Members own it, govern it through a tenure-earned vote that can't be bought, and share its surplus through patronage dividends. The base case uses \u003cstrong>no government grants or government loans\u003c/strong>.\u003c/p>\n\u003cdiv class=\"figs\">\n\u003cdiv>\u003cb>9,571\u003c/b>\u003cspan>premises within 1 mile of the shore (verified from county parcels)\u003c/span>\u003c/div>\n\u003cdiv>\u003cb>4,211\u003c/b>\u003cspan>members by Year 5 at a 44% take rate\u003c/span>\u003c/div>\n\u003cdiv>\u003cb>$8.6M\u003c/b>\u003cspan>five-year capital cost, including $300k of land\u003c/span>\u003c/div>\n\u003cdiv>\u003cb>$3.6M\u003c/b>\u003cspan>peak funding need before cash turns positive\u003c/span>\u003c/div>\n\u003cdiv>\u003cb>$516\u003c/b>\u003cspan>cost per premises passed (fiber overbuild ≈ $1,800)\u003c/span>\u003c/div>\n\u003cdiv>\u003cb>Year 2\u003c/b>\u003cspan>EBITDA-positive; cash-positive about Year 6\u003c/span>\u003c/div>\n\u003c/div>\n\u003ch3>What the plan rests on\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Verified geography, not estimates.\u003c/strong> Premises, zones, node sites and line of sight come from county parcels, USGS lake data and LiDAR. The LiDAR check showed real tree canopy blocks about half the clean wireless paths a simpler model predicted, so the design uses taller towers (30–45 m) and non-line-of-sight radios.\u003c/li>\n\u003cli>\u003cstrong>A hybrid network.\u003c/strong> Two diverse internet on-ramps, a backbone around and across the lake, 30 dock and relay nodes, and per-address choice of fiber or wireless.\u003c/li>\n\u003cli>\u003cstrong>Cooperative ownership.\u003c/strong> Governance (the non-transferable WAKE unit) is kept separate from money (patronage dividends), and capital never buys votes.\u003c/li>\n\u003cli>\u003cstrong>Grant-free funding.\u003c/strong> Founder equity, member capital, per-zone pre-sales, cooperative and commercial debt, and equipment finance. Each zone is built only when its own residents have reserved and committed capital.\u003c/li>\n\u003cli>\u003cstrong>DockOS, the operating software, is already largely built and tested.\u003c/strong> Serviceability and signup, member capital, governance voting, billing with RADIUS, work orders and boat/truck dispatch with a crew app, and a network operations center that finds root causes and credits members automatically.\u003c/li>\n\u003c/ul>\n\u003ch3>What testing changed\u003c/h3>\n\u003cp>Building and testing the plan against real data overturned three assumptions, and the plan now reflects each:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>\"The lake is the road\" is true for about a quarter of premises, not all.\u003c/strong> Against real roads, a boat beats a truck for 24% of premises at a 15-minute dock turnaround and 52% at 5 minutes. The field fleet is therefore hybrid, and dock turnaround is the key operating number.\u003c/li>\n\u003cli>\u003cstrong>The backbone \"ring\" is not a ring yet.\u003c/strong> 56% of Year-5 members sit behind a single point of failure. Five added links ($40k if radio paths are clear, up to $689k as fiber) remove most of that risk.\u003c/li>\n\u003cli>\u003cstrong>Weather affects wireless members differently from fiber members.\u003c/strong> Rain barely touches the bands used to reach homes, but storms still interrupt service through wet foliage, static and power blips. Three short backbone crossings are planned on a band heavy rain would knock out. Wireless members need to be told this before they sign up.\u003c/li>\n\u003c/ol>\n\u003cp>This paper is a \u003cstrong>working draft\u003c/strong>. 20 decisions remain open (see the register at the end). The plan is final when they're resolved.\u003c/p>"}, {"id": "opportunity", "num": "01", "title": "The opportunity: Beaver Lake", "html": "\u003cp>Beaver Lake is a U.S. Army Corps of Engineers reservoir on the White River: \u003cstrong>28,026 acres\u003c/strong> of water and \u003cstrong>445 miles\u003c/strong> of shoreline (both measured from the USGS lake polygon), across Benton, Washington and Carroll counties. Its shape is a long main channel with dozens of branching coves. That shape is why incumbents, who build along town roads, leave so much of the shoreline thinly served, and why a zoned, lake-aware network fits.\u003c/p>\n\u003ch3>Who is there\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Measure\u003c/th>\u003cth>Value\u003c/th>\u003cth>Source\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Premises within 1 mile of shore\u003c/td>\u003ctd>9,571\u003c/td>\u003ctd>County parcels with improvements (AR GIS Office)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Premises within ¼ mile\u003c/td>\u003ctd>6,144\u003c/td>\u003ctd>Same\u003c/td>\u003c/tr>\u003ctr>\u003ctd>By county (≤ 1 mile)\u003c/td>\u003ctd>Benton 7,190 · Washington 1,318 · Carroll 1,044 · Madison 19\u003c/td>\u003ctd>Same\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Vacant shoreline parcels (≤ ¼ mile)\u003c/td>\u003ctd>5,943\u003c/td>\u003ctd>Growth and host-site land\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Year-round vs seasonal homes\u003c/td>\u003ctd>55% / 45% (estimate, not yet verified)\u003c/td>\u003ctd>Homestead flags still to pull\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Demand and competition\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Demand:\u003c/strong> remote work, second homes and vacation rentals, and marinas and resorts that need dependable connectivity. Lakeshore owners skew toward higher incomes and value reliability and local service over price.\u003c/li>\n\u003cli>\u003cstrong>Competition:\u003c/strong> Cox, Sparklight, AT&amp;T, cooperative fiber (OzarksGo, Carroll Electric) and Starlink. They are strong in town and thin in the coves; the coves are BDN's opening.\u003c/li>\n\u003c/ul>\n\u003ch3>Zones and build order\u003c/h3>\n\u003cp>GIS analysis divided the shoreline into \u003cstrong>18 service zones\u003c/strong> (Z-01 to Z-18) and ranked \u003cstrong>30 candidate node sites\u003c/strong> by what they can see. Six nodes cover 60% of premises and all 30 cover 84%. The recommended first phase is \u003cstrong>Prairie Creek, Beaver Shores and Monte Ne\u003c/strong>, the densest part of the Benton County corridor.\u003c/p>"}, {"id": "cooperative", "num": "02", "title": "The model: a member-owned cooperative", "html": "\u003cp>BDN is designed as a \u003cstrong>member cooperative\u003c/strong>: the people it serves own and govern it. Two separate rails keep that simple and legally safe.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Rail\u003c/th>\u003cth>Vehicle\u003c/th>\u003cth>Who gets it\u003c/th>\u003cth>Legal nature\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Governance\u003c/td>\u003ctd>WAKE units (non-transferable)\u003c/td>\u003ctd>Earned by membership tenure\u003c/td>\u003ctd>Not a security: no price, can't be traded, no profit expectation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Economics\u003c/td>\u003ctd>Patronage dividends (cash or bill credit)\u003c/td>\u003ctd>Allocated by service purchased\u003c/td>\u003ctd>Established cooperative mechanism (Subchapter T)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>How WAKE works\u003c/h3>\n\u003cul>\n\u003cli>Every active member earns \u003cstrong>1 WAKE per month\u003c/strong>; members who host a network node earn \u003cstrong>1.5×\u003c/strong>.\u003c/li>\n\u003cli>A vote weighs \u003cstrong>1 + WAKE\u003c/strong>, capped at \u003cstrong>120\u003c/strong> (about ten years), so early members can't entrench permanently.\u003c/li>\n\u003cli>\u003cstrong>Anti-capture:\u003c/strong> no single member's vote may exceed the greater of 2% of the total or one equal share. The rule holds at any membership size and is unit-tested from 2 to 4,000 members.\u003c/li>\n\u003cli>Members who leave \u003cstrong>forfeit\u003c/strong> their WAKE to a Commons Pool; half the pool is redistributed to active members each year. A \u003cstrong>seasonal hold keeps membership and accrual\u003c/strong>, so lake residents don't lose their voice every winter.\u003c/li>\n\u003cli>Simulated over eight years, the founding cohort's share of the vote falls from 100% to about \u003cstrong>11%\u003c/strong>: the co-op decentralizes as it grows.\u003c/li>\n\u003c/ul>\n\u003ch3>Capital never buys votes\u003c/h3>\n\u003cp>Membership shares, deposits and founding capital (section 13) are financial instruments only. Founding members may receive recognition and a one-time, capped WAKE grant; that's an open decision. Governance stays tenure-earned. WAKE lives in DockOS's own ledger first; an on-chain mirror is optional later, and \u003cstrong>there will never be a token sale or tradable market\u003c/strong>.\u003c/p>\n\u003ch3>What members vote on\u003c/h3>\n\u003cp>Board seats, bylaw changes, patronage policy, which zones to build next, and major capital decisions. A working voting portal (proposals, tenure-weighted and capped voting, quorum) already exists.\u003c/p>\n\u003cblockquote>\u003cp>Securities and cooperative counsel must review the instruments and the WAKE design before launch. The design is deliberately shaped to make that review straightforward.\u003c/p>\u003c/blockquote>"}, {"id": "network", "num": "03", "title": "Network design", "html": "\u003cp>In one sentence: \u003cstrong>two diverse internet on-ramps feed a backbone around and across the lake (licensed microwave over water, fiber or radio on land), which feeds zoned dock and relay nodes that serve each address by fiber or wireless, whichever fits.\u003c/strong>\u003c/p>\n\u003ch3>The tiers\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tier\u003c/th>\u003cth>Role\u003c/th>\u003cth>Equipment class\u003c/th>\u003cth>Power\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>T0 head-end (×2)\u003c/td>\u003ctd>Internet on-ramp, border routing, core\u003c/td>\u003ctd>Border router, DWDM, core switching, CGNAT/DNS\u003c/td>\u003ctd>Grid + generator + UPS\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T1 core\u003c/td>\u003ctd>Backbone transport and aggregation on high ground\u003c/td>\u003ctd>Licensed microwave, aggregation router, optional fiber head (OLT)\u003c/td>\u003ctd>Grid + UPS (4–8 h)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T2 dock node (18)\u003c/td>\u003ctd>Serves a zone from a high shoreline point\u003c/td>\u003ctd>Access radios (sectors), optional fiber splitters, backhaul radio\u003c/td>\u003ctd>Grid + UPS\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T3 relay (12)\u003c/td>\u003ctd>Fills radio shadows and extends reach\u003c/td>\u003ctd>Relay radios\u003c/td>\u003ctd>Solar + LiFePO4, 2–3 days' autonomy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T4 premises\u003c/td>\u003ctd>The member's home or business\u003c/td>\u003ctd>Wireless receiver or fiber terminal, Wi-Fi router\u003c/td>\u003ctd>Member's power\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Choosing fiber or wireless per address\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>Fiber\u003c/strong> where homes are dense, where a business or marina needs it, or where a host site justifies it.\u003c/li>\n\u003cli>\u003cstrong>Non-line-of-sight wireless\u003c/strong> (Tarana-class radios on shared CBRS spectrum at 3.55–3.7 GHz, or 6 GHz) for tree-shadowed homes.\u003c/li>\n\u003cli>\u003cstrong>Line-of-sight wireless\u003c/strong> (Cambium or Ubiquiti 5/6 GHz sectors) for clear clusters and marinas.\u003c/li>\n\u003cli>A relay or fiber extension where none of those reaches.\u003c/li>\n\u003c/ol>\n\u003ch3>Backbone\u003c/h3>\n\u003cp>The designed backbone has \u003cstrong>41 links costing about $1.37M\u003c/strong>: 22 long lake crossings on licensed microwave with two dishes for diversity over water, 3 short lake hops, and 16 land hops. Long crossings target 99.999% availability per hop, with fade margins that account for the lake's seasonal level changes.\u003c/p>\n\u003ch3>Addressing and routing\u003c/h3>\n\u003cul>\n\u003cli>BDN's own ARIN AS number and IPv6 space (a /36, split into a /40 per region, a /44 per zone and a /56 per member), plus an IPv4 /24 through the waitlist with leased space as a bridge; carrier-grade NAT only as a stopgap.\u003c/li>\n\u003cli>BGP to both upstreams; IS-IS inside; an SR-MPLS or EVPN overlay for per-zone separation once zones grow.\u003c/li>\n\u003cli>RPKI route signing and validation, MANRS practices, BCP38 anti-spoofing, DDoS support written into the transit request.\u003c/li>\n\u003c/ul>\n\u003ch3>Standards\u003c/h3>\n\u003cp>XGS-PON (ITU-T G.9807.1) for fiber; FCC Part 96 (CBRS), Part 15 (unlicensed) and Part 101 (licensed microwave); NEC 800/810 and Motorola R56 grounding; NEMA-4X enclosures. Equipment is specified by class, not brand, so electronics can be swapped as technology improves. The full engineering spec is doc 21.\u003c/p>"}, {"id": "coverage", "num": "04", "title": "Coverage: what the GIS and LiDAR showed", "html": "\u003cp>Every coverage number in this plan comes from real spatial data, analysed in PostGIS.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Canopy-aware viewshed\u003c/strong> (bare-earth elevation plus the national land-cover canopy layer): 75% of premises (7,154) are reachable by line-of-sight wireless and 25% (2,417) sit in radio shadow and need a relay or fiber. On bare earth alone the figure would be 87%.\u003c/li>\n\u003cli>\u003cstrong>LiDAR validation.\u003c/strong> A true surface model built from 3DEP LiDAR point clouds found real canopy blocks much more than the land-cover layer suggests: in Phase 1 zones, clean line of sight at short masts was \u003cstrong>26%, not 44%\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>The engineering answer:\u003c/strong> 30–45 m towers (recovering line of sight to about 40–45%), non-line-of-sight radios for the rest, and more relays and fiber. The financial model was rebuilt on this LiDAR-informed base case. That's why capital cost is $8.6M rather than the earlier $7.5M.\u003c/li>\n\u003c/ul>\n\u003cp>Outputs you can inspect: the zone and node tables, the build-order ranking, the LiDAR validation table, and the interactive \u003ca href=\"https://claude.ai/artifact/L4Jq482X74PeXJkWBL71cS\">Beaver Lake Network Map\u003c/a>.\u003c/p>"}, {"id": "reliability", "num": "05", "title": "Reliability: the ring audit", "html": "\u003cp>The early plan called the backbone \"a ring, so any one break heals.\" When the network operations software was tested against the designed topology, it showed \u003cstrong>the backbone is not yet a ring\u003c/strong>. It is a tree with a few loops.\u003c/p>\n\u003cdiv class=\"flag\">\u003cp>\u003cstrong>5 links and 8 sites are single points of failure.\u003c/strong> 2,367 of 4,211 Year-5 members (56%) sit behind at least one. The worst, land hop SP-06-13, carries 2,243 members, half the network. The northwest head-end connects only to the site at that link's end.\u003c/p>\u003c/div>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Single point of failure\u003c/th>\u003cth>Kind\u003c/th>\u003cth class=\"n\">Sites cut off\u003c/th>\u003cth class=\"n\">Members behind it\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SP-06-13\u003c/td>\u003ctd>land link\u003c/td>\u003ctd class=\"n\">13\u003c/td>\u003ctd class=\"n\">2,243\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BDN-Z-02-N13\u003c/td>\u003ctd>T2 site\u003c/td>\u003ctd class=\"n\">13\u003c/td>\u003ctd class=\"n\">2,243\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SP-06-10\u003c/td>\u003ctd>water long link\u003c/td>\u003ctd class=\"n\">12\u003c/td>\u003ctd class=\"n\">1,751\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BDN-Z-01-N06\u003c/td>\u003ctd>T2 site\u003c/td>\u003ctd class=\"n\">12\u003c/td>\u003ctd class=\"n\">1,751\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SP-10-14\u003c/td>\u003ctd>land link\u003c/td>\u003ctd class=\"n\">11\u003c/td>\u003ctd class=\"n\">1,537\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BDN-Z-08-N10\u003c/td>\u003ctd>T3 site\u003c/td>\u003ctd class=\"n\">11\u003c/td>\u003ctd class=\"n\">1,537\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SP-14-18\u003c/td>\u003ctd>land link\u003c/td>\u003ctd class=\"n\">10\u003c/td>\u003ctd class=\"n\">1,350\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BDN-Z-06-N14\u003c/td>\u003ctd>T2 site\u003c/td>\u003ctd class=\"n\">10\u003c/td>\u003ctd class=\"n\">1,350\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BDN-Z-18-N18\u003c/td>\u003ctd>T2 site\u003c/td>\u003ctd class=\"n\">9\u003c/td>\u003ctd class=\"n\">1,310\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SP-11-28\u003c/td>\u003ctd>water long link\u003c/td>\u003ctd class=\"n\">3\u003c/td>\u003ctd class=\"n\">429\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BDN-Z-10-N11\u003c/td>\u003ctd>T2 site\u003c/td>\u003ctd class=\"n\">3\u003c/td>\u003ctd class=\"n\">429\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BDN-Z-10-N28\u003c/td>\u003ctd>T3 site\u003c/td>\u003ctd class=\"n\">2\u003c/td>\u003ctd class=\"n\">311\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BDN-Z-16-N05\u003c/td>\u003ctd>T2 site\u003c/td>\u003ctd class=\"n\">2\u003c/td>\u003ctd class=\"n\">124\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>The fix: close the ring\u003c/h3>\n\u003cp>A planner added, one at a time, the cheapest link (within 7 km) that removes the worst remaining weak point:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Removes\u003c/th>\u003cth>Adds a link between\u003c/th>\u003cth class=\"n\">km\u003c/th>\u003cth class=\"n\">As radio\u003c/th>\u003cth class=\"n\">If it must be fiber\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>SP-06-13\u003c/td>\u003ctd>BDN-Z-08-N10 ↔ BDN-Z-08-N29\u003c/td>\u003ctd class=\"n\">6.44\u003c/td>\u003ctd class=\"n\">$8,000\u003c/td>\u003ctd class=\"n\">$149,975\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>SP-10-14\u003c/td>\u003ctd>BDN-Z-18-N18 ↔ BDN-Z-08-N10\u003c/td>\u003ctd class=\"n\">5.37\u003c/td>\u003ctd class=\"n\">$8,000\u003c/td>\u003ctd class=\"n\">$125,055\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>BDN-Z-08-N10\u003c/td>\u003ctd>BDN-Z-18-N18 ↔ BDN-Z-01-N06\u003c/td>\u003ctd class=\"n\">6.58\u003c/td>\u003ctd class=\"n\">$8,000\u003c/td>\u003ctd class=\"n\">$153,415\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>BDN-Z-18-N18\u003c/td>\u003ctd>BDN-Z-04-N12 ↔ BDN-Z-01-N06\u003c/td>\u003ctd class=\"n\">6.6\u003c/td>\u003ctd class=\"n\">$8,000\u003c/td>\u003ctd class=\"n\">$153,711\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>SP-11-28\u003c/td>\u003ctd>BDN-Z-07-N04 ↔ BDN-Z-10-N11\u003c/td>\u003ctd class=\"n\">4.6\u003c/td>\u003ctd class=\"n\">$8,000\u003c/td>\u003ctd class=\"n\">$107,290\u003c/td>\u003c/tr>\u003ctr class=\"total\">\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>Total\u003c/td>\u003ctd class=\"n\">\u003c/td>\u003ctd class=\"n\">$40,000\u003c/td>\u003ctd class=\"n\">$689,446\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Afterwards there are no bridge links, and members behind a single point of failure drop from 2,367 to \u003cstrong>553\u003c/strong>. Two sites remain weak points (BDN-Z-10-N11 with 429 members and BDN-Z-16-N05 with 124), because neither has another site within 7 km. Each needs a new relay site or a dual-radio node with a hot spare.\u003c/p>\n\u003ch3>Recommendation\u003c/h3>\n\u003col>\n\u003cli>Survey the five paths with LiDAR before buying backbone equipment. Radio prices assume clear paths, and canopy blocks about half.\u003c/li>\n\u003cli>Budget $40k, and move individual links to licensed microwave or fiber only where the survey fails.\u003c/li>\n\u003cli>Give the northwest head-end a second connection.\u003c/li>\n\u003c/ol>\n\u003cp>The financial model does not yet include this cost; that's an open decision. The weak points are also visible on the \u003ca href=\"https://claude.ai/artifact/XTgZQdX7AoB6URdGadwsNX\">DockOS NOC board\u003c/a>.\u003c/p>"}, {"id": "weather", "num": "06", "title": "Weather and wireless service", "html": "\u003cp>Fiber members and wireless members will have different experiences in storms, and this plan says so plainly.\u003c/p>\n\u003ch3>How much rain actually costs each band\u003c/h3>\n\u003cp>Using the ITU rain models for Beaver Lake, a heavy storm (about 48 mm per hour, the rate exceeded roughly 53 minutes a year) weakens a 2 km radio link by:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Band\u003c/th>\u003cth>Used for\u003c/th>\u003cth class=\"n\">Signal lost over 2 km\u003c/th>\u003cth>Effect\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>3.6 GHz (CBRS)\u003c/td>\u003ctd>Non-line-of-sight radios to tree-shadowed homes\u003c/td>\u003ctd class=\"n\">0.06 dB\u003c/td>\u003ctd>None\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5–6 GHz\u003c/td>\u003ctd>Line-of-sight radios to homes\u003c/td>\u003ctd class=\"n\">0.5–0.9 dB\u003c/td>\u003ctd>Small\u003c/td>\u003c/tr>\u003ctr>\u003ctd>11 GHz\u003c/td>\u003ctd>Licensed long lake crossings\u003c/td>\u003ctd class=\"n\">about 4 dB\u003c/td>\u003ctd>Designed for\u003c/td>\u003c/tr>\u003ctr>\u003ctd>23 GHz\u003c/td>\u003ctd>Licensed short hops\u003c/td>\u003ctd class=\"n\">about 13 dB\u003c/td>\u003ctd>Needs margin\u003c/td>\u003c/tr>\u003ctr>\u003ctd>60 GHz\u003c/td>\u003ctd>Short unlicensed backhaul\u003c/td>\u003ctd class=\"n\">about 33 dB\u003c/td>\u003ctd>Link drops\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Why storms still interrupt home wireless\u003c/h3>\n\u003cp>Home links are designed with at least 10 dB of spare signal, so on the bands BDN uses to reach homes, rain alone shouldn't drop them. Storm outages usually come from rain-soaked leaves in the path, water in cable connectors, static from nearby lightning that locks up a radio or router, or a power blip at the house or the tower. Needing to reset equipment after a storm points to that lock-up, and that part is fixable.\u003c/p>\n\u003ch3>What BDN will do about it\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Self-recovering equipment.\u003c/strong> Radios run a connection watchdog (Ubiquiti calls it Ping Watchdog) that restarts the radio automatically, and the network operations center can restart any member radio remotely.\u003c/li>\n\u003cli>\u003cstrong>Surge standard on every install.\u003c/strong> A surge protector at the antenna and at the building entry, shielded cable, and proper grounding. Nothing protects against a direct lightning strike.\u003c/li>\n\u003cli>\u003cstrong>No bare 60 GHz where it matters.\u003c/strong> 60 GHz is used only on very short links, and only with a built-in 5 GHz backup such as airFiber 60 LR or 60 XG, tested before relying on it.\u003c/li>\n\u003cli>\u003cstrong>Storm handling in operations:\u003c/strong> recognize storm-wide drops, restart what hasn't recovered after the storm, send one notice, and send a crew to any install that drops in every storm.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"flag\">\u003cp>\u003cstrong>Design issue to fix before buying equipment:\u003c/strong> three short lake crossings (2.3–2.6 km) are planned as \"unlicensed 60 or 5 GHz.\" At 60 GHz, heavy rain adds about 40 dB of loss and moderate rain about 25 dB, which would drop them and, with the ring not yet closed, could take whole zones down. They should be 5/6 GHz, 60 GHz with 5 GHz backup, or licensed 18/23 GHz.\u003c/p>\u003c/div>\n\u003ch3>What wireless members will be told\u003c/h3>\n\u003cblockquote>\u003cp>Fixed-wireless service reaches your home by radio from a nearby network site. Heavy rain, wet leaves and nearby lightning can briefly interrupt it, usually for a few minutes while a storm passes. Your equipment is set to recover on its own, and we can restart it remotely. If service isn't back 15 minutes after the storm passes, unplug the outdoor antenna's power adapter for 30 seconds, plug it back in, then restart your router. Short weather interruptions aren't covered by outage credits; outages of 24 hours or more are.\u003c/p>\u003c/blockquote>\n\u003cp>Wireless applicants would acknowledge this at signup, and it would go in the member agreement. What BDN asks of wireless members is small: keep the router and antenna adapter on a surge strip (ideally a small battery backup), and know the one-step reset.\u003c/p>\n\u003cdiv class=\"proposed\">\u003cp>\u003cstrong>Status:\u003c/strong> proposed, not yet built. The disclosure in the signup portal, the storm mode in operations and the wireless equipment spec are the next items once approved.\u003c/p>\u003c/div>"}, {"id": "transit", "num": "07", "title": "Internet transit and middle-mile", "html": "\u003cp>BDN buys two things: \u003cstrong>transport\u003c/strong> from a carrier's point of presence to each head-end, and \u003cstrong>IP transit\u003c/strong>, the route to the internet. The two paths must be physically separate so one cut can't darken the lake.\u003c/p>\n\u003cp>\u003cstrong>Key finding:\u003c/strong> Diamond State Networks, a wholesale middle-mile network formed by 13 Arkansas electric cooperatives including OzarksGo, already sells exactly this, over 50,000+ route-miles. It is the lead candidate for path A, co-op to co-op. Path B goes to a physically diverse second carrier chosen by RFQ (candidates: Uniti, Lumen, Cox Business, Aristotle, AT&amp;T Wholesale).\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Year\u003c/th>\u003cth class=\"n\">Members\u003c/th>\u003cth class=\"n\">Peak (Gbps)\u003c/th>\u003cth class=\"n\">Provisioned (Gbps)\u003c/th>\u003cth>Ports per path\u003c/th>\u003cth class=\"n\">Est. cost/yr\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Y1\u003c/td>\u003ctd class=\"n\">835\u003c/td>\u003ctd class=\"n\">2.7\u003c/td>\u003ctd class=\"n\">3.8\u003c/td>\u003ctd>10G ×2\u003c/td>\u003ctd class=\"n\">~$58k\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Y2\u003c/td>\u003ctd class=\"n\">1,889\u003c/td>\u003ctd class=\"n\">6.9\u003c/td>\u003ctd class=\"n\">9.6\u003c/td>\u003ctd>10G ×2\u003c/td>\u003ctd class=\"n\">~$92k\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Y3\u003c/td>\u003ctd class=\"n\">2,963\u003c/td>\u003ctd class=\"n\">12.3\u003c/td>\u003ctd class=\"n\">17.3\u003c/td>\u003ctd>25G ×2\u003c/td>\u003ctd class=\"n\">~$127k\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Y4\u003c/td>\u003ctd class=\"n\">3,828\u003c/td>\u003ctd class=\"n\">17.9\u003c/td>\u003ctd class=\"n\">25.1\u003c/td>\u003ctd>25G ×2\u003c/td>\u003ctd class=\"n\">~$157k\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Y5\u003c/td>\u003ctd class=\"n\">4,211\u003c/td>\u003ctd class=\"n\">21.9\u003c/td>\u003ctd class=\"n\">30.7\u003c/td>\u003ctd>100G ×2\u003c/td>\u003ctd class=\"n\">~$213k\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The RFQ, provider outreach list, provider scorecard, ARIN resource request and a four-layer path-diversity acceptance test are packaged and ready to send. What remains needs a person: forming the entity (which ARIN requires), confirming exact POP sites, and sending the RFQ.\u003c/p>"}, {"id": "sites", "num": "08", "title": "Sites and real estate", "html": "\u003cp>\u003cstrong>Own the two head-end sites outright; lease or take recorded easements for everything else.\u003c/strong>\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Site\u003c/th>\u003cth>What it is\u003c/th>\u003cth>Own, lease or easement\u003c/th>\u003cth>Why\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>T0 head-end ×2\u003c/td>\u003ctd>Internet on-ramp and core equipment\u003c/td>\u003ctd>Buy (fee simple)\u003c/td>\u003ctd>Permanent control; collateral for co-op debt; no eviction or rent-escalation risk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T1 core\u003c/td>\u003ctd>Ridge-top backbone sites\u003c/td>\u003ctd>Long ground lease (10–25 yr), or buy if strategic\u003c/td>\u003ctd>Control without full capital\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T2/T3 edge (~30)\u003c/td>\u003ctd>Dishes and cabinets on high points and member docks\u003c/td>\u003ctd>Recorded easement or member host\u003c/td>\u003ctd>Cheap and fast; hosts earn 1.5× WAKE and a service credit\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Enclosures:\u003c/strong> a walk-in shelter only where a head-end's equipment density justifies it; pad-mounted outdoor cabinets for most T0/T1 and dense T2 sites; small pole-mounted cabinets for edge nodes and relays.\u003c/li>\n\u003cli>\u003cstrong>A good head-end parcel\u003c/strong> has a short fiber lateral to a carrier, a route diverse from the other head-end, commercial power with generator room, height for lake crossings, both road and boat access, and clean zoning outside restricted Corps shoreline.\u003c/li>\n\u003cli>\u003cstrong>Money:\u003c/strong> the model carries $150k of land for each head-end ($300k total). Owned land and equipment give a collateral base of about $2.2M.\u003c/li>\n\u003cli>\u003cstrong>Legal wrapper for each purchase:\u003c/strong> title and survey, zoning or conditional use, FAA review for towers, Corps review near the shoreline, Phase I environmental, and floodplain checks.\u003c/li>\n\u003c/ul>\n\u003cp>A lakeside head-end parcel could also be the boat and operations base. Whether to combine them is an open decision.\u003c/p>"}, {"id": "operations", "num": "09", "title": "Operations: boat-native, and measured", "html": "\u003cp>Field work (builds, installs and repairs) is dispatched by software, with crews on boats or trucks. The plan originally assumed the boat would always be faster. It was tested against the real lake and the real road network.\u003c/p>\n\u003cdiv class=\"figs\">\u003cdiv>\u003cb>24%\u003c/b>\u003cspan>of premises where a boat beats a truck, at 15 min per dock stop\u003c/span>\u003c/div>\u003cdiv>\u003cb>52%\u003c/b>\u003cspan>at 5 min per dock stop\u003c/span>\u003c/div>\u003cdiv>\u003cb>1,905\u003c/b>\u003cspan>premises in five boat-first zones\u003c/span>\u003c/div>\u003cdiv>\u003cb>5,514\u003c/b>\u003cspan>premises in eight truck-first zones\u003c/span>\u003c/div>\u003c/div>\n\u003cp>\u003cstrong>What decides it is the time each dock stop takes\u003c/strong> (tie up, unload, walk up), not boat speed or the number of yards. The plan therefore runs a \u003cstrong>hybrid fleet\u003c/strong>:\u003c/p>\n\u003cul>\n\u003cli>Boats own the boat-first arms (Lost Bridge, Township of Prairie, Huffman Ford, Vista Shores, Ventris) and all waterside work: dock nodes, lake crossings, underwater cable and shoreline host sites.\u003c/li>\n\u003cli>Service trucks are primary in the truck-first zones, which include the three largest.\u003c/li>\n\u003cli>Dock turnaround of \u003cstrong>8 minutes or less\u003c/strong> is the key operating target. It's measured on every stop by the crew app, and the planner uses the measured figure once it has enough samples.\u003c/li>\n\u003c/ul>\n\u003ch3>How a day works\u003c/h3>\n\u003cul>\n\u003cli>A \u003cstrong>weather gate\u003c/strong> uses the National Weather Service hourly forecast: each boat class has its own wind limit (jon boat 15 mph, pontoon 20, center console 25), and thunderstorms keep boats in. Boat-only jobs wait; others go by truck. The dispatcher can override.\u003c/li>\n\u003cli>The planner assigns each job to the eligible crew where it adds the least travel, within the shift. An outage repair goes in as the \u003cstrong>next stop\u003c/strong> of whichever crew can get there first.\u003c/li>\n\u003cli>Crews use an \u003cstrong>offline-first phone app\u003c/strong>: run sheet, lake chart with routes, checklists, required readings, barcode scanning, and a queue that syncs when there's signal. Finishing an install starts the member's billing.\u003c/li>\n\u003c/ul>\n\u003ch3>Safety\u003c/h3>\n\u003cp>Coast Guard-compliant vessels, float plans, a buddy system for mid-lake and mast work, lightning and wind stand-downs, fall protection, and zero-spill discipline near the Beaver Water District drinking-water source: sealed batteries, spill kits and no fueling over water.\u003c/p>\n\u003ch3>Seasonality\u003c/h3>\n\u003cp>Builds and installs peak spring to fall; winter is for hardening nodes, maintenance, design and permitting. Solar sites are sized for winter minimums.\u003c/p>"}, {"id": "dockos", "num": "10", "title": "DockOS: the software that runs the co-op", "html": "\u003cp>DockOS is one open-source-first system with PostGIS as the single source of truth for the network, the members, the money and the map. Seven of its eight modules are built and tested end to end against real services and data.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Module\u003c/th>\u003cth>Status\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1–2\u003c/td>\u003ctd>PostGIS + GIS analysis\u003c/td>\u003ctd>Built\u003c/td>\u003ctd>Premises, zones, line of sight, viewshed, build order\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Serviceability + signup portal\u003c/td>\u003ctd>Built\u003c/td>\u003ctd>Drop a pin, see if it's served, reserve, pledge; live \u003ca href=\"https://claude.ai/artifact/LeEBTN21as8wm7EBQRtrpe\">signup portal\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>—\u003c/td>\u003ctd>Member capital + governance\u003c/td>\u003ctd>Built\u003c/td>\u003ctd>Pledges through Stripe; WAKE ledger and \u003ca href=\"https://claude.ai/artifact/VdhypMHV8Z748GMJhgZiXK\">voting portal\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4–5\u003c/td>\u003ctd>Work orders, dispatch, crew app\u003c/td>\u003ctd>Built · 43 checks\u003c/td>\u003ctd>Sign-up to install to first bill; \u003ca href=\"https://claude.ai/artifact/5teoYVbPD7nKjV55wNN3KH\">DockOS Crew\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Billing, provisioning, RADIUS\u003c/td>\u003ctd>Built · 46 checks\u003c/td>\u003ctd>Tested against a live FreeRADIUS server\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>Network operations + outages\u003c/td>\u003ctd>Built · 52 checks\u003c/td>\u003ctd>Root cause, dispatch, notices, credits; \u003ca href=\"https://claude.ai/artifact/XTgZQdX7AoB6URdGadwsNX\">DockOS NOC\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>Compliance advisor\u003c/td>\u003ctd>Next\u003c/td>\u003ctd>Arkansas, county and federal obligations, tracked per work order\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Design choices worth knowing\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Billing state is network policy.\u003c/strong> The RADIUS tables that authorize members are database views over billing, so a suspension or plan change takes effect on the next connection with nothing to sync. Live sessions are updated immediately.\u003c/li>\n\u003cli>\u003cstrong>Outages close on telemetry, not on a crew's word.\u003c/strong> The operations center turns an alarm storm into one root cause, tells affected members once, and credits them automatically.\u003c/li>\n\u003cli>\u003cstrong>Offline-first field work.\u003c/strong> Every tap is queued with an ID and applied exactly once when signal returns.\u003c/li>\n\u003cli>\u003cstrong>Everything is tested end to end\u003c/strong> on real data: 141 automated checks across the three operational suites.\u003c/li>\n\u003c/ul>"}, {"id": "members", "num": "11", "title": "The member experience", "html": "\u003ch3>Plans and prices (planning)\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Plan\u003c/th>\u003cth>Speed (symmetric)\u003c/th>\u003cth class=\"n\">Price/month\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Cove\u003c/td>\u003ctd>300 Mbps\u003c/td>\u003ctd class=\"n\">$69\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Shoreline\u003c/td>\u003ctd>1 Gbps\u003c/td>\u003ctd class=\"n\">$89\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Deep Water\u003c/td>\u003ctd>2–5 Gbps (fiber where available)\u003c/td>\u003ctd class=\"n\">$129–$199\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dock Business\u003c/td>\u003ctd>1 Gbps + static IP\u003c/td>\u003ctd class=\"n\">$199\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Marina Managed\u003c/td>\u003ctd>Multi-gig + managed slip Wi-Fi\u003c/td>\u003ctd class=\"n\">$399–$1,200\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Resort/Enterprise\u003c/td>\u003ctd>Custom + SLA\u003c/td>\u003ctd class=\"n\">Custom\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>No data caps. Add-ons: managed Wi-Fi, static IPs, voice, marina guest Wi-Fi, priority business service.\u003c/p>\n\u003ch3>Host a node\u003c/h3>\n\u003cp>Owners who host equipment get a service credit (about $25/month for a relay, $75/month or free Shoreline service for a dock node, free service plus a lease payment for a core site) and earn WAKE at 1.5×. This recruits the best sites while building loyalty and coverage.\u003c/p>\n\u003ch3>Joining and paying\u003c/h3>\n\u003cul>\n\u003cli>Check an address, reserve with a refundable $100 deposit, and become a member with a $200 share.\u003c/li>\n\u003cli>After installation, the first bill is prorated, with the deposit credited against it.\u003c/li>\n\u003cli>Late payments: a reminder at 10 days, restricted access at 21 days, and termination at 60 days.\u003c/li>\n\u003cli>\u003cstrong>Seasonal hold\u003c/strong> for lake homes: $10/month, and membership and WAKE continue.\u003c/li>\n\u003cli>Instant plan changes. Cancelling forfeits WAKE to the Commons Pool (a hold is offered instead).\u003c/li>\n\u003c/ul>\n\u003ch3>When something breaks\u003c/h3>\n\u003cul>\n\u003cli>Affected members get one text and email with an estimated restore time, and a \"restored\" notice afterwards.\u003c/li>\n\u003cli>A public status page shows each area's state with no personal data.\u003c/li>\n\u003cli>\u003cstrong>Credits are automatic (proposed terms):\u003c/strong> businesses get twice the prorated time for any outage over 4 hours; residential members get whole days for outages of 24 hours or more. Both are capped at one month and applied to the next bill.\u003c/li>\n\u003cli>Members on seasonal hold aren't counted as down.\u003c/li>\n\u003c/ul>"}, {"id": "financials", "num": "12", "title": "Financial plan", "html": "\u003cp>The base case is LiDAR-informed and grant-free. Figures are in thousands of dollars unless noted.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth class=\"n\">Y1\u003c/th>\u003cth class=\"n\">Y2\u003c/th>\u003cth class=\"n\">Y3\u003c/th>\u003cth class=\"n\">Y4\u003c/th>\u003cth class=\"n\">Y5\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Premises passed\u003c/td>\u003ctd class=\"n\">3,341\u003c/td>\u003ctd class=\"n\">6,298\u003c/td>\u003ctd class=\"n\">8,231\u003c/td>\u003ctd class=\"n\">9,571\u003c/td>\u003ctd class=\"n\">9,571\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Members\u003c/td>\u003ctd class=\"n\">835\u003c/td>\u003ctd class=\"n\">1,889\u003c/td>\u003ctd class=\"n\">2,963\u003c/td>\u003ctd class=\"n\">3,828\u003c/td>\u003ctd class=\"n\">4,211\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Take rate\u003c/td>\u003ctd class=\"n\">25%\u003c/td>\u003ctd class=\"n\">30%\u003c/td>\u003ctd class=\"n\">36%\u003c/td>\u003ctd class=\"n\">40%\u003c/td>\u003ctd class=\"n\">44%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Revenue\u003c/td>\u003ctd class=\"n\">558\u003c/td>\u003ctd class=\"n\">1,819\u003c/td>\u003ctd class=\"n\">3,240\u003c/td>\u003ctd class=\"n\">4,536\u003c/td>\u003ctd class=\"n\">5,369\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Operating cost\u003c/td>\u003ctd class=\"n\">710\u003c/td>\u003ctd class=\"n\">1,180\u003c/td>\u003ctd class=\"n\">1,750\u003c/td>\u003ctd class=\"n\">2,300\u003c/td>\u003ctd class=\"n\">2,820\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EBITDA\u003c/td>\u003ctd class=\"n\">\u003cspan class=\"neg\">(152)\u003c/span>\u003c/td>\u003ctd class=\"n\">639\u003c/td>\u003ctd class=\"n\">1,490\u003c/td>\u003ctd class=\"n\">2,236\u003c/td>\u003ctd class=\"n\">2,549\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Capital spending\u003c/td>\u003ctd class=\"n\">2,548\u003c/td>\u003ctd class=\"n\">1,565\u003c/td>\u003ctd class=\"n\">1,382\u003c/td>\u003ctd class=\"n\">1,109\u003c/td>\u003ctd class=\"n\">2,006\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cash flow before financing\u003c/td>\u003ctd class=\"n\">\u003cspan class=\"neg\">(2,700)\u003c/span>\u003c/td>\u003ctd class=\"n\">\u003cspan class=\"neg\">(926)\u003c/span>\u003c/td>\u003ctd class=\"n\">108\u003c/td>\u003ctd class=\"n\">1,127\u003c/td>\u003ctd class=\"n\">543\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cumulative cash\u003c/td>\u003ctd class=\"n\">\u003cspan class=\"neg\">(2,700)\u003c/span>\u003c/td>\u003ctd class=\"n\">\u003cspan class=\"neg\">(3,626)\u003c/span>\u003c/td>\u003ctd class=\"n\">\u003cspan class=\"neg\">(3,518)\u003c/span>\u003c/td>\u003ctd class=\"n\">\u003cspan class=\"neg\">(2,391)\u003c/span>\u003c/td>\u003ctd class=\"n\">\u003cspan class=\"neg\">(1,848)\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"figs\">\u003cdiv>\u003cb>$8.6M\u003c/b>\u003cspan>5-year capital ($4.9M infrastructure, $300k land)\u003c/span>\u003c/div>\u003cdiv>\u003cb>$3.6M\u003c/b>\u003cspan>peak funding need\u003c/span>\u003c/div>\u003cdiv>\u003cb>$516\u003c/b>\u003cspan>per premises passed\u003c/span>\u003c/div>\u003cdiv>\u003cb>$2,045\u003c/b>\u003cspan>per member connected\u003c/span>\u003c/div>\u003cdiv>\u003cb>$105\u003c/b>\u003cspan>average revenue per member per month\u003c/span>\u003c/div>\u003cdiv>\u003cb>$2.2M\u003c/b>\u003cspan>owned-asset collateral base\u003c/span>\u003c/div>\u003c/div>\n\u003ch3>Accounting principle\u003c/h3>\n\u003cp>Labor and materials that build the network are capitalized and depreciated; operating cost is only the team that runs the business. That's why EBITDA turns positive in Year 2 while cumulative cash doesn't until about Year 6.\u003c/p>\n\u003ch3>Not yet in the model\u003c/h3>\n\u003cul>\n\u003cli>Closing the ring: $40k (radio) to $689k (all fiber).\u003c/li>\n\u003cli>A fleet re-cut toward service trucks and fewer, better-equipped boats.\u003c/li>\n\u003cli>Real transit quotes, which replace the planning estimates in section 7.\u003c/li>\n\u003cli>Any change from the three short lake crossings (section 6).\u003c/li>\n\u003c/ul>"}, {"id": "funding", "num": "13", "title": "Funding without grants", "html": "\u003cp>The base case uses \u003cstrong>no BEAD, USDA, state grants or federal loans\u003c/strong>. Grants are optional upside only if the landscape changes, never a dependency.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Source\u003c/th>\u003cth>Role\u003c/th>\u003cth class=\"n\">Indicative size\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Founder / owner equity\u003c/td>\u003ctd>First-in risk capital: entity, GIS, pilot\u003c/td>\u003ctd class=\"n\">$0.75–1.25M\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Member capital\u003c/td>\u003ctd>The grant replacement: shares, founding capital, retained patronage\u003c/td>\u003ctd class=\"n\">$0.6–1.2M\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pre-sales deposits\u003c/td>\u003ctd>Working capital per zone; gates each build\u003c/td>\u003ctd class=\"n\">Rolling\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cooperative and commercial debt\u003c/td>\u003ctd>Most infrastructure (CoBank, RTFC/CFC, local banks)\u003c/td>\u003ctd class=\"n\">$1.0–2.0M\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Equipment financing / leasing\u003c/td>\u003ctd>Radios, fiber electronics, fleet\u003c/td>\u003ctd class=\"n\">$0.5–1.0M\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Anchor prepayments\u003c/td>\u003ctd>Marinas and resorts prepaying multi-year service\u003c/td>\u003ctd class=\"n\">Situational\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>The member-capital campaign\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Instrument\u003c/th>\u003cth>Amount\u003c/th>\u003cth>Refundable?\u003c/th>\u003cth>Purpose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Membership share\u003c/td>\u003ctd>$200 once\u003c/td>\u003ctd>Yes, on exit\u003c/td>\u003ctd>Member-owner; starts WAKE accrual\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reservation deposit\u003c/td>\u003ctd>$100\u003c/td>\u003ctd>Yes; credited to the first bill\u003c/td>\u003ctd>Reserves a spot, funds the zone, proves demand\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Founding-member capital\u003c/td>\u003ctd>$500 / $1,500 / $5,000\u003c/td>\u003ctd>Per terms (revolving member capital)\u003c/td>\u003ctd>Early risk capital from residents, marinas and resorts\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>A zone is built only when both are true:\u003c/strong> reservations reach 25% of its premises, \u003cem>and\u003c/em> committed capital reaches $75 per premises. Members vote with deposits, and BDN builds where the lake asks. The owner's campaign cockpit tracks each zone against its gate live. Deposits and founding capital sit in a segregated escrow account.\u003c/p>\n\u003cp>Lenders need three things: pre-sales traction per zone, a verified data room (GIS, cost per passing, pro forma, maps), and a credible team with clean co-op governance.\u003c/p>"}, {"id": "legal", "num": "14", "title": "Legal, entity and regulatory", "html": "\u003ch3>Entity\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Recommended vehicle:\u003c/strong> an Arkansas \u003cstrong>Telecommunications Cooperative\u003c/strong> under the Rural Telephone Cooperative Act (Act 51 of 1951). Articles are filed with the Secretary of State. A general cooperative is the alternative; that choice is an open decision for counsel.\u003c/li>\n\u003cli>\u003cstrong>A question counsel must answer early:\u003c/strong> cooperative statutes often require one member, one vote. Counsel needs to confirm whether WAKE's tenure-weighted, capped voting is permitted, or whether it must sit on top of a one-member-one-vote legal floor or be advisory.\u003c/li>\n\u003cli>\u003cstrong>Tax:\u003c/strong> Subchapter T, so patronage dividends aren't taxed at the co-op level.\u003c/li>\n\u003cli>\u003cstrong>Critical path:\u003c/strong> counsel and CPA engaged → name and registered agent → Articles filed → EIN → ARIN organization, AS number and IP space, bank and escrow → bylaws and organizational meeting (can now sign transit and take member capital) → FCC registration and data filings, with Corps, pole and road permits started in parallel.\u003c/li>\n\u003c/ul>\n\u003ch3>Federal and state\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>FCC:\u003c/strong> registration number and Broadband Data Collection filings; Form 499 and Universal Service contributions only if voice is offered; licensing for microwave paths; CBRS requires a spectrum-access account and certified installers.\u003c/li>\n\u003cli>\u003cstrong>Arkansas:\u003c/strong> Secretary of State filings and DFA sales-tax registration for taxable equipment.\u003c/li>\n\u003c/ul>\n\u003ch3>The lake: U.S. Army Corps of Engineers\u003c/h3>\n\u003cp>Beaver Lake is a federal reservoir managed under the Corps' Shoreline Management Plan. Any structure, cable landing or crossing on Corps shoreline or lakebed needs authorization: a shoreline use permit or real-estate outgrant, and Section 10/404 permits for work in or over the water. The design keeps sites on private host land above the Corps take line and crosses the lake by radio wherever possible. Radio signals over water need no permit; underwater cable is the heaviest case.\u003c/p>\n\u003ch3>Also\u003c/h3>\n\u003cul>\n\u003cli>Pole attachments (Ozarks Electric, Carroll Electric, SWEPCO) and county road permits for fiber.\u003c/li>\n\u003cli>FAA review for 30–45 m towers.\u003c/li>\n\u003cli>Arkansas 811 before digging.\u003c/li>\n\u003cli>Zoning for head-ends.\u003c/li>\n\u003cli>Insurance.\u003c/li>\n\u003cli>Securities counsel for every member-capital instrument.\u003c/li>\n\u003c/ul>\n\u003cblockquote>\u003cp>Not legal advice. Every item needs cooperative, securities and telecom counsel and a co-op-experienced CPA before filing.\u003c/p>\u003c/blockquote>"}, {"id": "team", "num": "15", "title": "Team", "html": "\u003cp>Lean at the pilot stage: each role is a hat before it's a headcount, and DockOS lets a small team run a large network.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Phase\u003c/th>\u003cth>Roles\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0 — Foundations\u003c/td>\u003ctd>Owner/CEO; network architect (RF and fiber); GIS analyst; software/DevOps engineer; regulatory and permitting lead; financing manager (part-time); bookkeeper/CPA (contract)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1 — Pilot\u003c/td>\u003ctd>Field operations lead; 2–3 field technicians (fiber and wireless); 1–2 NOC and support technicians; procurement and inventory coordinator; sales and community manager\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2+ — Region and ring\u003c/td>\u003ctd>Field crews per zone, NOC shifts, support reps, construction manager, controller, HR\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Ready-to-post job descriptions exist for every role. Technicians are cross-trained on boats and trucks, since the fleet is hybrid.\u003c/p>"}, {"id": "roadmap", "num": "16", "title": "Roadmap", "html": "\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Phase\u003c/th>\u003cth>When\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0 — Foundations\u003c/td>\u003ctd>Months 0–4\u003c/td>\u003ctd>Form the co-op; ARIN; two transit agreements; Corps and pole conversations; pilot design; host-site recruiting; member-capital campaign opens\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1 — Pilot\u003c/td>\u003ctd>Months 4–12\u003c/td>\u003ctd>Two head-ends, the first backbone segment, one lake crossing; 1–2 dock nodes; first paying members; real costs feed back into the model\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 — Central region\u003c/td>\u003ctd>Years 1–2\u003c/td>\u003ctd>Complete the central Benton corridor; close cooperative/commercial debt on pilot proof; scale crews; formal NOC shifts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3 — Ring closure\u003c/td>\u003ctd>Years 2–3\u003c/td>\u003ctd>Build the backbone around and across, including the ring-closing links; expand dock nodes and relays\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4 — Long tail\u003c/td>\u003ctd>Years 3–5\u003c/td>\u003ctd>Upper arms and sparse coves, each gated by pre-sales; fiber overbuild where wireless zones mature\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Software leads the build slightly, so every zone is measured, sold and managed from data. The remaining module is the compliance advisor.\u003c/p>"}, {"id": "launch", "num": "17", "title": "Launch plan: the first 90 days", "html": "\u003cp>From engaging counsel to a pilot go/no-go, September 28 to December 28, 2026. The live \u003ca href=\"https://claude.ai/artifact/FoM5mbfAWq36NiJcinnXTK\">launch tracker\u003c/a> holds the current status of each milestone. Every Monday an automated check-in reads replies in the founder's inbox, updates the tracker, drafts polite follow-ups where someone hasn't replied (drafts only, never sent), and flags what's stuck. The same milestones are on the founder's calendar.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>When\u003c/th>\u003cth>Due\u003c/th>\u003cth>Milestone\u003c/th>\u003cth>Who\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Weeks 1–2\u003c/td>\u003ctd>Oct 5\u003c/td>\u003ctd>Send the transit request to Diamond State Networks / OzarksGo\u003c/td>\u003ctd>You (draft ready)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Weeks 1–2\u003c/td>\u003ctd>Oct 9\u003c/td>\u003ctd>Engage cooperative/securities counsel and a co-op CPA\u003c/td>\u003ctd>You (draft ready)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Weeks 1–2\u003c/td>\u003ctd>Oct 9\u003c/td>\u003ctd>Name the two head-end (internet on-ramp) locations\u003c/td>\u003ctd>You\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Weeks 1–2\u003c/td>\u003ctd>Oct 9\u003c/td>\u003ctd>Confirm the pilot zones\u003c/td>\u003ctd>You\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Weeks 1–2\u003c/td>\u003ctd>Oct 16\u003c/td>\u003ctd>Recruit the founding board / incorporators\u003c/td>\u003ctd>You\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Weeks 2–6\u003c/td>\u003ctd>Oct 16\u003c/td>\u003ctd>Decide the legal form with counsel\u003c/td>\u003ctd>You + counsel\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Weeks 2–6\u003c/td>\u003ctd>Oct 16\u003c/td>\u003ctd>Send the Army Corps introduction\u003c/td>\u003ctd>You (Claude can draft)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Weeks 2–6\u003c/td>\u003ctd>Oct 30\u003c/td>\u003ctd>File the Articles, get the EIN, open bank and escrow accounts\u003c/td>\u003ctd>You + counsel\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Weeks 2–6\u003c/td>\u003ctd>Nov 6\u003c/td>\u003ctd>File the ARIN and FCC registrations\u003c/td>\u003ctd>You (Claude preps)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Weeks 2–6\u003c/td>\u003ctd>Nov 13\u003c/td>\u003ctd>Score the transit quotes and update the model\u003c/td>\u003ctd>Claude (weekly check-in) + you\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Weeks 2–6\u003c/td>\u003ctd>Nov 13\u003c/td>\u003ctd>Submit pole-attachment applications\u003c/td>\u003ctd>You (Claude can draft)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Weeks 2–6\u003c/td>\u003ctd>Nov 13\u003c/td>\u003ctd>Hold the Army Corps meeting\u003c/td>\u003ctd>You\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Months 2–4\u003c/td>\u003ctd>Dec 4\u003c/td>\u003ctd>Field-verify the pilot\u003c/td>\u003ctd>You + RF engineer or contractor\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Months 2–4\u003c/td>\u003ctd>Dec 11\u003c/td>\u003ctd>Sign purchase options on the head-end parcels\u003c/td>\u003ctd>You + counsel\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Months 2–4\u003c/td>\u003ctd>Dec 11\u003c/td>\u003ctd>Get radio demos and quotes; decide the short lake crossings\u003c/td>\u003ctd>You + RF engineer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Months 2–4\u003c/td>\u003ctd>Dec 18\u003c/td>\u003ctd>Open the member-capital campaign in the pilot zones\u003c/td>\u003ctd>You + counsel; Claude deploys\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Months 2–4\u003c/td>\u003ctd>Dec 18\u003c/td>\u003ctd>Meet lenders\u003c/td>\u003ctd>You\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Months 2–4\u003c/td>\u003ctd>Dec 23\u003c/td>\u003ctd>Make an offer to a network/RF engineer\u003c/td>\u003ctd>You\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Months 2–4\u003c/td>\u003ctd>Dec 28\u003c/td>\u003ctd>90-day review: pilot go/no-go readiness\u003c/td>\u003ctd>You + board\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Already prepared:\u003c/strong> Gmail drafts of the transit request to Diamond State Networks/OzarksGo, a template for the second carrier, and an engagement inquiry to cooperative counsel. Each needs only a name, a phone number and a send.\u003c/p>\n\u003cp>\u003cstrong>The go/no-go gate on December 28:\u003c/strong> pilot zones at 25% reservations and $75 per premises committed, both transit paths signed, first permits in hand, and financing committed.\u003c/p>"}, {"id": "risks", "num": "18", "title": "Risks and mitigations", "html": "\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Risk\u003c/th>\u003cth>Mitigation\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Corps and permitting delays (the biggest schedule risk)\u003c/td>\u003ctd>Start at entity formation; dedicated permitting lead; radio crossings over underwater cable; sites above the Corps take line\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Single points of failure in the backbone\u003c/td>\u003ctd>Close the ring (section 5); dual-home the NW head-end; hot spares at the two remaining weak sites\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tree canopy blocks more radio paths than expected\u003c/td>\u003ctd>LiDAR-informed design; 30–45 m towers; non-line-of-sight radios; relays and fiber\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Storm interruptions for wireless members\u003c/td>\u003ctd>Self-recovering equipment, surge standard, remote restart, honest disclosure, no bare 60 GHz on the backbone\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Thin take-up in sparse zones\u003c/td>\u003ctd>Per-zone build gate on reservations and capital\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Capital cost overruns\u003c/td>\u003ctd>Phase-gated spending; wireless-first mix; equipment financing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Securities treatment of member capital or WAKE\u003c/td>\u003ctd>Two-rail design; counsel review before taking any money; no token sale ever\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Boat operations limited by weather and dock time\u003c/td>\u003ctd>Hybrid fleet; weather gate; turnaround measured and improved\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Incumbent price response\u003c/td>\u003ctd>Compete on reliability, symmetry and local service\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Key people and skills\u003c/td>\u003ctd>Documented standards, cross-training, DockOS doing the routine work\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}, {"id": "reconcile", "num": "19", "title": "Inconsistencies to reconcile", "html": "\u003cp>Writing this paper surfaced places where earlier documents disagree with later findings. Each should be corrected before the plan is final:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Grants:\u003c/strong> the roadmap (doc 15) still mentions grants and federal RUS loans in Phases 2 and 4, and the team plan lists a grants manager, but the base case is grant-free (doc 13).\u003c/li>\n\u003cli>\u003cstrong>Funding figures:\u003c/strong> doc 13 still cites $7.5M capital and a $3.1M peak, superseded by the LiDAR-informed $8.6M and $3.6M.\u003c/li>\n\u003cli>\u003cstrong>Entity:\u003c/strong> the business plan (doc 06) suggests an LLC; the entity checklist (doc 19) recommends a telecommunications cooperative.\u003c/li>\n\u003cli>\u003cstrong>\"Redundant spine\"\u003c/strong> wording in docs 01, 06 and the README predates the ring audit.\u003c/li>\n\u003cli>\u003cstrong>IPv6 size:\u003c/strong> docs 01 and 17 say /32; the ARIN request and doc 21 use /36.\u003c/li>\n\u003cli>\u003cstrong>Premises:\u003c/strong> the business plan's ~9,000 estimate is superseded by the verified 9,571.\u003c/li>\n\u003cli>\u003cstrong>Short lake crossings\u003c/strong> are specified as \"60 or 5 GHz\" in the backbone design; see section 6.\u003c/li>\n\u003c/ul>"}, {"id": "appendix", "num": "20", "title": "Appendix: documents, pages and terms", "html": "\u003ch3>Planning documents (repository)\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Doc\u003c/th>\u003cth>Subject\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>01–03\u003c/td>\u003ctd>Technology review, comparable networks, network architecture\u003c/td>\u003c/tr>\u003ctr>\u003ctd>04–05\u003c/td>\u003ctd>Geography and zones; GIS plan\u003c/td>\u003c/tr>\u003ctr>\u003ctd>06–08\u003c/td>\u003ctd>Business plan; operations; staffing (with job descriptions)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>09–11\u003c/td>\u003ctd>Accounting and pro forma; materials and BOM kits; procurement\u003c/td>\u003c/tr>\u003ctr>\u003ctd>12–13\u003c/td>\u003ctd>Regulatory and permitting; grant-independent financing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>14–15\u003c/td>\u003ctd>DockOS architecture; roadmap\u003c/td>\u003c/tr>\u003ctr>\u003ctd>16\u003c/td>\u003ctd>Cooperative governance and WAKE\u003c/td>\u003c/tr>\u003ctr>\u003ctd>17\u003c/td>\u003ctd>Middle-mile and transit (with RFQ package)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>18\u003c/td>\u003ctd>Member-capital campaign\u003c/td>\u003c/tr>\u003ctr>\u003ctd>19\u003c/td>\u003ctd>Entity formation checklist\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20\u003c/td>\u003ctd>Sites and real estate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>21\u003c/td>\u003ctd>Engineering design spec\u003c/td>\u003c/tr>\u003ctr>\u003ctd>22\u003c/td>\u003ctd>Billing, provisioning, RADIUS\u003c/td>\u003c/tr>\u003ctr>\u003ctd>23\u003c/td>\u003ctd>Dispatch, work orders, crew app\u003c/td>\u003c/tr>\u003ctr>\u003ctd>24\u003c/td>\u003ctd>Network operations and outage management\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Companion pages\u003c/h3>\n\u003cul>\n\u003cli>\u003ca href=\"https://claude.ai/artifact/L4Jq482X74PeXJkWBL71cS\">Beaver Lake Network Map\u003c/a> — zones, nodes, backbone\u003c/li>\n\u003cli>\u003ca href=\"https://claude.ai/artifact/DSMpCES5QV2KJbGZhGjEV4\">Pro Forma dashboard\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://claude.ai/artifact/AiAAbkuYFqzFaeqwFQVMEc\">Investor and lender deck\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://claude.ai/artifact/Fk7Sbu2NjYmhffo5mwugHw\">WAKE governance explainer\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://claude.ai/artifact/LeEBTN21as8wm7EBQRtrpe\">Join Boat Dock Network\u003c/a> — signup and pledges\u003c/li>\n\u003cli>\u003ca href=\"https://claude.ai/artifact/VdhypMHV8Z748GMJhgZiXK\">Member voting\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://claude.ai/artifact/5teoYVbPD7nKjV55wNN3KH\">DockOS Crew\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://claude.ai/artifact/XTgZQdX7AoB6URdGadwsNX\">DockOS NOC\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>Each page is private to its owner until shared.\u003c/p>\n\u003ch3>Terms\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Term\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>WAKE\u003c/td>\u003ctd>The co-op's non-transferable governance unit, earned 1 per month of membership\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Patronage dividend\u003c/td>\u003ctd>Surplus returned to members in proportion to service purchased\u003c/td>\u003c/tr>\u003ctr>\u003ctd>T0–T4\u003c/td>\u003ctd>Network tiers: head-end, core, dock node, relay, premises\u003c/td>\u003c/tr>\u003ctr>\u003ctd>nLOS\u003c/td>\u003ctd>Non-line-of-sight radio that works through some foliage and obstruction\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CBRS\u003c/td>\u003ctd>3.55–3.7 GHz shared spectrum, used by registering each radio with a spectrum access system (FCC Part 96)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SPOF\u003c/td>\u003ctd>Single point of failure: one link or site whose loss cuts members off\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Take rate\u003c/td>\u003ctd>Share of premises passed that become members\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dock turnaround\u003c/td>\u003ctd>Minutes a boat stop costs beyond travel and the job itself\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RADIUS\u003c/td>\u003ctd>The system that authorizes each member's connection\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}], "decisions": [{"id": "D01", "area": "Legal", "question": "Which cooperative vehicle?", "options": "Telecommunications cooperative (Act 51) · general cooperative", "recommendation": "Telecommunications cooperative, confirmed by counsel", "ref": "Section 14 · doc 19", "status": "open", "decision": "", "note": ""}, {"id": "D02", "area": "Sites", "question": "Own or lease the two head-end sites, and where exactly?", "options": "Buy fee simple · long ground lease · colocate", "recommendation": "Buy both; confirm the two known internet-buy locations can be owned", "ref": "Section 8 · doc 20", "status": "open", "decision": "", "note": ""}, {"id": "D03", "area": "Sites", "question": "Should a lakeside head-end double as the boat and operations base?", "options": "Combine · keep separate", "recommendation": "Combine if the parcel meets both sets of criteria", "ref": "Sections 8–9 · doc 20", "status": "open", "decision": "", "note": ""}, {"id": "D04", "area": "Reliability", "question": "Close the ring: budget and method for the five added links", "options": "Radio ($40k) · mixed · all fiber ($689k)", "recommendation": "Survey first; budget $40k plus contingency; fall back per link", "ref": "Section 5 · doc 24", "status": "open", "decision": "", "note": ""}, {"id": "D05", "area": "Reliability", "question": "Give the northwest head-end a second connection?", "options": "Yes · defer", "recommendation": "Yes", "ref": "Section 5 · doc 24", "status": "open", "decision": "", "note": ""}, {"id": "D06", "area": "Reliability", "question": "The two remaining weak sites (N11, N05)", "options": "New relay site · dual-radio hot spare · accept the risk", "recommendation": "Dual-radio hot spares now; relay sites if the zones grow", "ref": "Section 5", "status": "open", "decision": "", "note": ""}, {"id": "D07", "area": "Wireless", "question": "The three short lake crossings", "options": "5/6 GHz · 60 GHz with 5 GHz backup · licensed 18/23 GHz", "recommendation": "Licensed 23 GHz where capacity is needed, otherwise 5/6 GHz; no bare 60 GHz", "ref": "Section 6", "status": "open", "decision": "", "note": ""}, {"id": "D08", "area": "Wireless", "question": "Access radio vendors and install standard", "options": "Tarana + Cambium · Tarana + Ubiquiti · single vendor", "recommendation": "Tarana for tree-shadowed homes plus one line-of-sight vendor; watchdog and surge standard on every install", "ref": "Sections 3, 6 · docs 01, 10", "status": "open", "decision": "", "note": ""}, {"id": "D09", "area": "Members", "question": "Adopt the wireless weather disclosure and require acknowledgment?", "options": "Adopt as written · revise · don't require acknowledgment", "recommendation": "Adopt; wireless applicants acknowledge at signup", "ref": "Section 6", "status": "open", "decision": "", "note": ""}, {"id": "D10", "area": "Members", "question": "Outage credit terms", "options": "As proposed · different thresholds · claim-based", "recommendation": "As proposed; the board sets them in the member agreement", "ref": "Section 11 · doc 24", "status": "open", "decision": "", "note": ""}, {"id": "D11", "area": "Members", "question": "Plan pricing", "options": "As listed · adjust tiers", "recommendation": "As listed until real transit quotes arrive", "ref": "Section 11 · doc 06", "status": "open", "decision": "", "note": ""}, {"id": "D12", "area": "Operations", "question": "Fleet mix", "options": "Boat-heavy (original) · hybrid · truck-heavy", "recommendation": "Hybrid: trucks primary in truck-first zones, fewer and better-equipped boats", "ref": "Section 9 · doc 23", "status": "open", "decision": "", "note": ""}, {"id": "D13", "area": "Operations", "question": "Pilot zones", "options": "Prairie Creek, Beaver Shores, Monte Ne · other", "recommendation": "As ranked, subject to each zone's build gate", "ref": "Sections 1, 16", "status": "open", "decision": "", "note": ""}, {"id": "D14", "area": "Transit", "question": "Transit paths A and B", "options": "DSN/OzarksGo for A · RFQ scoring for B", "recommendation": "DSN/OzarksGo for A; B from the RFQ scorecard", "ref": "Section 7 · doc 17", "status": "open", "decision": "", "note": ""}, {"id": "D15", "area": "Funding", "question": "Member-capital amounts and the zone build gate", "options": "$200 / $100 / tiers; 25% and $75 per premises · adjust", "recommendation": "As modeled, confirmed by securities counsel", "ref": "Section 13 · doc 18", "status":
